name: build + gates

# Pages itself deploys from main:/docs (branch-and-folder publishing), so this workflow does not
# publish. It exists so a pull request cannot merge a site that fails its own rules — a broken
# build has never been caught by an intention.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: No dependencies to install (checked anyway)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "zero runtime dependencies — nothing to install"; fi
      - name: Data validation (blanks declared, quotes dated, cross-references intact)
        run: node tools/validate-data.mjs
      - name: Build
        run: node site/build.mjs
      - name: Link validation (internal links, tags, rel, hosts)
        run: node tools/validate-links.mjs
      - name: Compliance gate (disclosure, wording, schema, feeds)
        run: node tools/compliance-gate.mjs
      - name: The built site must match what the source produces
        run: |
          git add -A docs
          if git diff --staged --quiet -- docs; then
            echo "docs/ is up to date with site/ and data/"
          else
            echo "::error::docs/ in the commit differs from a fresh build. Run: node site/build.mjs && git add docs && git commit"
            git diff --staged --stat -- docs
            exit 1
          fi
      - name: Feed and sitemap sanity
        run: |
          test -s docs/sitemap.xml && test -s docs/feed.xml && test -f docs/.nojekyll
          grep -q '<urlset' docs/sitemap.xml
          grep -q 'lastBuildDate' docs/feed.xml
          python3 - <<'PY'
          import xml.dom.minidom, glob
          for f in ["docs/sitemap.xml", "docs/feed.xml"]:
              xml.dom.minidom.parse(f)
              print("well-formed:", f)
          PY
