name: Build, verify and deploy

# Order matters. If any gate fails, the deploy job never starts and the
# previously published site stays live. A non-compliant or broken build
# cannot reach readers through this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Main site: generated at the repo root, which is the Pages source.
      - name: Build main site
        run: python3 tools/build.py

      # Preview edition: generated into /v2/ from its own registers.
      - name: Build v2 edition
        run: node v2/src/scripts/build.mjs

      # Gate the v2 edition's own invariants.
      - name: Verify v2 edition
        run: node v2/src/scripts/verify.mjs

      # Gate the whole repository exactly as it will be served.
      - name: Verify repository
        run: node scripts/check-site.mjs

      # The committed output must equal the built output, or reviewers are
      # reading something different from what ships.
      - name: Check the build is reproducible
        run: |
          if ! git diff --quiet; then
            echo "::error::Committed files differ from a fresh build. Run python3 tools/build.py and node v2/src/scripts/build.mjs, then commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
