name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and run the publication gate
        run: node _src/build.mjs

      - name: Site checks (second, independent gate)
        # Written without reading _src/build.mjs, on purpose: an independent implementation is how
        # the last hole in this site was found (see COORDINATION.md, session 41096d21).
        run: node scripts/check-site.mjs

      - name: Compliance gate (disclosure order, claim bans, cross-references)
        run: node scripts/compliance-gate.mjs

      - name: The empty-state tools must still be honest
        run: |
          node scripts/collect.mjs | tee /tmp/collect.log
          grep -q "nothing to collect" /tmp/collect.log
          node scripts/next-topics.mjs | tee /tmp/topics.log
          grep -q "no query data yet" /tmp/topics.log

      - name: Collector contract self-test
        # The collector is not deployed, so nothing else exercises it. This starts it on an
        # ephemeral port with a temporary state directory and asserts the contract the privacy
        # story depends on: five events, an allow-list, no identifiers, a token-protected summary.
        run: node scripts/analytics-selftest.mjs

      - name: Verify the build is reproducible and committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'node _src/build.mjs' and commit the result."
            git status --porcelain
            exit 1
          fi

      - name: Publish decision (what a human still owes)
        run: node scripts/publish-gate.mjs --committed

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: VALIDATION.md
          retention-days: 30
